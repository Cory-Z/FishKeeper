<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FishKeeper API Playground</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        margin: 0;
        padding: 2rem;
        background: #f5f7fa;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      main {
        max-width: 520px;
        width: 100%;
        background: #fff;
        padding: 2rem;
        border-radius: 16px;
        box-shadow: 0 20px 30px -15px rgba(15, 20, 40, 0.3);
      }

      h1 {
        margin-top: 0;
        margin-bottom: 1rem;
        font-size: 1.9rem;
      }

      p {
        margin-top: 0;
        margin-bottom: 1.5rem;
        color: #5a6170;
      }

      .actions {
        display: grid;
        gap: 1rem;
      }

      button {
        padding: 0.75rem 1rem;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 600;
        background: #2463eb;
        color: #fff;
        transition: transform 0.1s ease-in-out, box-shadow 0.1s ease-in-out;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 18px -14px rgba(0, 0, 0, 0.6);
      }

      button:active {
        transform: translateY(0);
        box-shadow: none;
      }

      #result {
        margin-top: 2rem;
        padding: 1rem 1.25rem;
        border-radius: 12px;
        background: #eef2ff;
        color: #273272;
        min-height: 3.5rem;
        display: flex;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>FishKeeper Route Tester</h1>
      <p>Run the Node server and tap any button to hit its matching endpoint.</p>
      <section class="actions">
        <button data-endpoint="/getcat" data-method="GET">
          GET /getcat
        </button>
        <button data-endpoint="/getdog" data-method="GET">
          GET /getdog
        </button>
        <button data-endpoint="/additem" data-method="PUT">
          PUT /additem
        </button>
        <button data-endpoint="/" data-method="GET">
          GET /
        </button>
      </section>
      <output id="result" aria-live="polite">
        Response will appear here.
      </output>
    </main>
    <script>
      const baseUrl = "http://127.0.0.1:3000";
      const resultBox = document.querySelector("#result");

      async function hitEndpoint(endpoint, method) {
        resultBox.textContent = "Loading...";
        try {
          const response = await fetch(`${baseUrl}${endpoint}`, { method });
          if (!response.ok) {
            throw new Error(`${response.status} ${response.statusText}`);
          }
          const text = await response.text();
          resultBox.textContent = text || "(No body returned)";
        } catch (error) {
          resultBox.textContent = `Request failed: ${error.message}`;
        }
      }

      document.querySelectorAll("button[data-endpoint]").forEach((button) => {
        button.addEventListener("click", () => {
          const endpoint = button.dataset.endpoint;
          const method = button.dataset.method;
          hitEndpoint(endpoint, method);
        });
      });
    </script>
  </body>
</html>
