<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Fish Keeper</title>
  </head>
  <body>

    <h1>Fish Keeper</h1>

    <button onclick="loadFish();">Show Fish List</button>
<button id="hideButton" onclick="hideFish();" style="display:none;">Hide Fish List</button>
<br/><br/>

    <label>Fish Name:</label>
    <input type="text" id="fishName" onkeyup="suggest();" autocomplete="off">
    <div id="suggestions" style="border:1px solid #aaa; width:320px; display:none; background:#fff;"></div>
    <br/>

    <label>Minimum Size (in inches):</label>
    <input type="number" id="fishSize" step="0.1" disabled>
    <br/><br/>

    <button onclick="saveFish();">Add / Update Fish</button>
    <br/><br/>


    <table width="50%" border="1" cellspacing="0" cellpadding="5" style="border:4px solid #000000; background-color:aqua;" id="fishTable">
      <tr style="background-color: azure;">

   
        <th>Fish Name</th>
        <th>Minimum Size to Keep (in inches)</th>
        <th>Actions</th>
      </tr>
    </table>

    <script src="script.js" defer></script>
  </body>
</html>
